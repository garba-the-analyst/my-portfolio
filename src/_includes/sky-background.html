<style>
      .sky-layer {
        position: fixed;
        inset: 0;
        z-index: -1;
        pointer-events: none;
        overflow: hidden;
        background: #000000;
      }
      .sky-layer svg {
        display: block;
      }
      .star {
        animation-name: twinkle;
        animation-timing-function: ease-in-out;
        animation-iteration-count: infinite;
      }
      @keyframes twinkle {
        0%,
        100% {
          opacity: var(--base-op, 0.6);
        }
        50% {
          opacity: calc(var(--base-op, 0.6) * 0.2);
        }
      }
      .moon-wrap {
        position: fixed;
        top: clamp(16px, 4vh, 40px);
        right: clamp(16px, 4vw, 48px);
        width: clamp(64px, 8vw, 120px);
        z-index: -1;
        pointer-events: none;
        animation: moon-float 11s ease-in-out infinite;
      }
      .moon-wrap svg {
        display: block;
        width: 100%;
        height: auto;
      }
      @keyframes moon-float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-6px);
        }
      }
      .moon-glow {
        animation: moon-glow-pulse 7s ease-in-out infinite;
        transform-origin: center;
      }
      @keyframes moon-glow-pulse {
        0%,
        100% {
          opacity: 0.8;
          transform: scale(1);
        }

    <script>
      // Computes today's real moon phase (visitor's local date) and updates the SVG path
      // accordingly, so the illustration always reflects the current phase, not a fixed snapshot.
      (function () {
        var pathEl = document.getElementById("moon-shape");
        if (!pathEl) return;
        var R = 62,
          CX = 100,
          CY = 100;
        var refNewMoon = Date.UTC(2000, 0, 6, 18, 14, 0); // known reference new moon
        var synodicMonth = 29.530588861; // days, mean lunar cycle length
        var now = new Date();
        var daysSince = (now.getTime() - refNewMoon) / 86400000;
        var phase = (((daysSince % synodicMonth) + synodicMonth) % synodicMonth) / synodicMonth; // 0..1
        var theta = 2 * Math.PI * phase;
        var x = R * Math.cos(theta);
        var waxing = phase <= 0.5;
        var rx = Math.abs(x).toFixed(3);
        var firstSweep = waxing ? 1 : 0;
        var secondSweep = waxing ? (x < 0 ? 1 : 0) : x < 0 ? 0 : 1;
        var top = CX + "," + (CY - R);
        var bot = CX + "," + (CY + R);
        var d =
          "M " + top + " A " + R + "," + R + " 0 0," + firstSweep + " " + bot +
          " A " + rx + "," + R + " 0 0," + secondSweep + " " + top + " Z";
        pathEl.setAttribute("d", d);
      })();
    </script>
